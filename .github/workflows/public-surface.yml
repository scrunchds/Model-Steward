name: Public Surface

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect package and repository surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run pack:check
      - name: Reject common secret and local-path patterns
        shell: bash
        run: |
          if git grep -nEI '(sk-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|C:\\Users\\|/Users/[^/]+/|/home/[^/]+/|E:\\Sandbox|E:/Sandbox)' -- . ':!package-lock.json' ':!.github/workflows/public-surface.yml'; then
            echo 'Public-surface scan failed.' >&2
            exit 1
          fi
